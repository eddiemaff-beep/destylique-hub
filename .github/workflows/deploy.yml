name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          VITE_AUTH_ENABLED: "false"
        run: npm run build

      - name: Prepare Pages files
        run: |
          test -f .vercel/output/static/index.html
          test -f .vercel/output/static/fashion/index.html
          test -f .vercel/output/static/realestate/index.html
          cp .vercel/output/static/index.html .vercel/output/static/404.html
          cp CNAME .vercel/output/static/CNAME
          : > .vercel/output/static/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
